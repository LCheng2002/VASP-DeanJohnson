name: Submit Mg versus Mg2Ni region H2 CI-NEB
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-h2-neb-20261013.yml']
permissions:
  contents: read
concurrency:
  group: h2-dissociation-ci-neb-20261013
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate reviewed files and fixed two-path scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/H2_dissociation_NEB_20261013/neb_core.py calculations/H2_dissociation_NEB_20261013/neb_driver.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('calculations/H2_dissociation_NEB_20261013')
          d=json.loads((p/'plan.json').read_text())
          assert set(d['systems'])=={'Mg','Mg2Ni_region'}
          assert d['protocol']['images']==5 and d['protocol']['NEB_mpi_ranks']==60
          assert d['protocol']['NEB_mpi_ranks'] % d['protocol']['images']==0
          assert set(d['sources'])=={'Mg_clean','Ni_clean','Ni_molecule','Ni_product'}
          print('INPUT_CHECK|2 paths,5 moving images each,60 MPI ranks for each band')
          PY
      - name: Deploy approved driver and submit Slurm dependency chains
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION|$name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_neb"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_neb-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_neb" "$HOME/.ssh/hpc_neb-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_neb" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_neb" -o CertificateFile="$HOME/.ssh/hpc_neb-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage='VASP/github_jobs/H2_NEB_driver_20261013'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -C calculations/H2_dissociation_NEB_20261013 -cf - neb_core.py neb_driver.py plan.json | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          ssh "${opts[@]}" "$remote" "bash -lc 'module purge; module load oneapi vasp/6.3.2-vtst-intel-2021.4.0; python3 \"\$HOME/$stage/neb_driver.py\" --submit'" | tee h2_neb_submission.txt
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/H2_dissociation_compare_20261013/neb_driver.py" --status' | tee h2_neb_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2-ci-neb-submission-20261013
          path: |
            h2_neb_submission.txt
            h2_neb_status.txt
          retention-days: 14
