name: Audit small Mg2Ni low-H screening parents
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-small-mg2nihx-20261013.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read source reference and geometry metadata only
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/audit_small_Mg2Ni_bulk_20261013.py
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_audit"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_audit-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_audit" "$HOME/.ssh/hpc_audit-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_audit" "$HOME/.ssh/hpc_audit-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_audit" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/hpc_audit" -o CertificateFile="$HOME/.ssh/hpc_audit-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' < scripts/audit_small_Mg2Ni_bulk_20261013.py > mg2ni_lowH_parent_audit.jsonl
          python3 - <<'PY'
          import json
          s=open('mg2ni_lowH_parent_audit.jsonl').read().strip()
          assert s.startswith('AUDIT|')
          d=json.loads(s.split('|',1)[1])
          print('SOURCE_AUDITED_AT',d['checked_at'])
          print('POTCAR_PRESENT',d['potential']['exists'])
          print('SOURCE_MODELS',[(k,list(v)) for k,v in d['bulk'].items()])
          print('H2_REFERENCE_MODELS',list(d['h2']))
          print('SMALL_BATCH_ALREADY_EXISTS',d['small_batch_exists'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mg2ni-lowH-source-audit-20261013
          path: mg2ni_lowH_parent_audit.jsonl
          retention-days: 7
