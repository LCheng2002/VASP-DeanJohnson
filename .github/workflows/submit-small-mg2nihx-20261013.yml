name: Submit five small Mg2Ni low-H bulk screening models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-small-mg2nihx-20261013.yml']
permissions:
  contents: read
concurrency:
  group: Mg2Ni-lowH-36atom-bulk-screen-20261013
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate bounded model manifest and Python driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Mg2Ni_lowH_bulk_20261013/screen.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('calculations/Mg2Ni_lowH_bulk_20261013/plan.json').read_text())
          assert len(d['models'])==5
          assert [x['atom_count'] for x in d['models']]==[36,38,38,39,39]
          assert [len(x['h_sites']) for x in d['models']]==[0,2,2,3,3]
          assert d['resource']['array_indices']=='0-4'
          assert all('NEB' not in n['name'] for n in d['models'])
          print('SCIENTIFIC_SCOPE_VALIDATED|5 small Mg2Ni only; no 147-atom restart')
          PY
      - name: Deploy approved source-only inputs and submit guarded Slurm array
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION|$name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_lowH"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_lowH-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_lowH" "$HOME/.ssh/hpc_lowH-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_lowH" "$HOME/.ssh/hpc_lowH-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_lowH" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_lowH" -o CertificateFile="$HOME/.ssh/hpc_lowH-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage='VASP/github_jobs/Mg2Ni_lowH_bulk_20261013'
          echo 'STAGE|Deploy text only; no VASP pseudopotentials in GitHub'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - \
            calculations/Mg2Ni_lowH_bulk_20261013/plan.json \
            calculations/Mg2Ni_lowH_bulk_20261013/screen.py \
            | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          echo 'STAGE|Validate existing Mg2Ni/H2/POTCAR and submit only 5 small bulk models'
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 calculations/Mg2Ni_lowH_bulk_20261013/screen.py --submit" | tee small_lowH_submission.txt
          echo 'STAGE|Read Slurm state without resubmitting'
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/Mg2Ni_lowH_bulk_20261013/screen.py" --status' | tee small_lowH_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Mg2Ni_lowH_small_bulk_submission
          path: |
            small_lowH_submission.txt
            small_lowH_status.txt
          retention-days: 7
