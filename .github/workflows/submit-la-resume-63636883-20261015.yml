name: Resume only three unfinished LaH3 endpoints after 63636883 timeout
# Retry after corrected legacy KPOINTS size preflight; prior attempt stopped before sbatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-la-resume-63636883-20261015.yml']
permissions:
  contents: read
concurrency:
  group: LaH3-timeout-63636883-exact-3-models-20261015
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate exactly three remaining La models using original constraints
        shell: bash
        run: |
          set -euo pipefail
          driver=calculations/Mechanism_extensions_20261012/continue_La_63636883_20261015.py
          python3 -m py_compile "$driver"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('calculations/Mechanism_extensions_20261012/continue_La_63636883_20261015.py').read_text()
          assert "MODELS=('L_vLa','L_MgH2_vMg','L_transfer')" in s
          assert "CHECKPOINT_SHA256='e6cde2a098bbe07aa0e18ab3fb267debbe7476eb3abe7aa04b8295a495b45da0'" in s
          assert "['--dependency=afterok:'+" in s
          assert "check_slurm()" in s and "check_source()" in s
          assert "runner.run_model('L_transfer')" in s
          assert "L_vMg_near" in s and "L_vMg_far" in s
          assert "L_MgH2_reference" in s
          print('SCOPE_OK|only three missing La endpoints; existing two are verified read-only')
          PY
      - name: Transfer text-only continuation driver then submit three Slurm tasks
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!key:-}" || { echo "MISSING_CONFIG|$key"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/la_continue_key"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/la_continue_key-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/la_continue_key" "$HOME/.ssh/la_continue_key-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/la_continue_key" "$HOME/.ssh/la_continue_key-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/la_continue_key" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/la_continue_key" -o CertificateFile="$HOME/.ssh/la_continue_key-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage="VASP/github_jobs/La_resume_63636883_20261015/$GITHUB_SHA"
          fname="calculations/Mechanism_extensions_20261012/continue_La_63636883_20261015.py"
          echo 'STAGE|Deploy only non-licensed Python continuation driver'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - "$fname" | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          echo 'STAGE|Read-only verification of recovered checkpoint and previously validated La sources'
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 $fname --precheck" | tee La_63636883_parent_precheck.txt
          echo 'STAGE|Submit La vacancy resume + independent MgH2 vacancy + La-transfer afterok'
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 $fname --submit" | tee La_63636883_resume_submissions.txt
          echo 'STAGE|Read-only Slurm queue/accounting of only the three new jobs'
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/MgNi_LaH3_extensions_20261012/La_resume_63636883_20261015/continue_La_63636883_20261015.py" --status' | tee La_63636883_resume_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: La_63636883_exact_three_continuations
          path: |
            La_63636883_parent_precheck.txt
            La_63636883_resume_submissions.txt
            La_63636883_resume_status.txt
          retention-days: 21
