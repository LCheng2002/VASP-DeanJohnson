name: Submit four archived Ca OH dipole P0 calibration points
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-ca-oh-p0-calibration-20261015.yml']
permissions:
  contents: read
concurrency:
  group: Ca-OH-P0-four-static-only-20261015
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preflight four archived geometries and no licensed pseudopotential
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Ca_OH_P0_calibration_v1/submit_and_check.py
          python3 calculations/Ca_OH_P0_calibration_v1/submit_and_check.py --check-inputs
          if find calculations/Ca_OH_P0_calibration_v1 -name POTCAR -print -quit | grep -q .; then
            echo 'ERROR|POTCAR must never enter public GitHub'
            exit 1
          fi
          echo 'P0_SCOPE_OK|Exactly four fixed-geometry single-point jobs'
      - name: Deploy text-only inputs and submit four-member Slurm array
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for x in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_KNOWN_HOSTS; do
            test -n "${!x:-}" || { echo "MISSING_CONFIG|$x"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/ca_p0_key"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/ca_p0_key-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ca_p0_key" "$HOME/.ssh/ca_p0_key-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/ca_p0_key" "$HOME/.ssh/ca_p0_key-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/ca_p0_key" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/ca_p0_key" -o CertificateFile="$HOME/.ssh/ca_p0_key-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage="VASP/github_jobs/Ca_OH_P0_calibration_v1/$GITHUB_SHA"
          files=(calculations/Ca_OH_P0_calibration_v1/submit_and_check.py calculations/Ca_OH_P0_calibration_v1/plan.json)
          for model in M0_OH M1_OH M0_OH_H2O M1_OH_H2O; do
            parent="calculations/Ca_corrosion_20261014/verified_parents_20261014/models/$model"
            files+=("$parent/results/01_relax/CONTCAR" "$parent/calculation_inputs/INCAR.static" "$parent/calculation_inputs/KPOINTS")
          done
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - "${files[@]}" | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          echo 'STAGE|Validate original archived structures and old licensed potential hashes locally'
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 calculations/Ca_OH_P0_calibration_v1/submit_and_check.py --submit" | tee ca_p0_submission.txt
          echo 'STAGE|Read real Slurm records'
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/Ca_OH_P0_calibration_v1/submit_and_check.py" --status' | tee ca_p0_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CaOH_P0_verified_submission_20261015
          path: |
            ca_p0_submission.txt
            ca_p0_status.txt
          retention-days: 14
