name: Check H2 CI-NEB comparison jobs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-h2-neb-20261013.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Query submitted records and collect fixed text inputs
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_neb"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_neb-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_neb" "$HOME/.ssh/hpc_neb-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_neb" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_neb" -o CertificateFile="$HOME/.ssh/hpc_neb-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/H2_dissociation_compare_20261013/neb_driver.py" --status' | tee h2_neb_status.txt
          ssh "${opts[@]}" "$remote" 'cd "$HOME/H2_dissociation_compare_20261013" && tar -czf - plan.json neb_driver.py neb_core.py manifest.json submission.json references.slurm H2.slurm endpoints.slurm NEB_Mg.slurm NEB_Mg2Ni.slurm Mg/clean/relax/POSCAR Mg/clean/relax/INCAR Mg/clean/relax/KPOINTS Mg2Ni_region/clean/relax/POSCAR Mg2Ni_region/clean/relax/INCAR Mg2Ni_region/clean/relax/KPOINTS H2/clean/relax/POSCAR H2/clean/relax/INCAR H2/clean/relax/KPOINTS sources/Mg_clean.vasp sources/Ni_clean.vasp sources/Ni_molecule.vasp sources/Ni_product.vasp' > h2_neb_production_inputs.tar.gz
          python3 - <<'PY'
          import tarfile,json
          with tarfile.open('h2_neb_production_inputs.tar.gz') as t:
              names=t.getnames()
              assert len(names)==23
              assert not any(n.endswith('POTCAR') or n.startswith('licensed/') for n in names)
              m=json.load(t.extractfile('manifest.json'))
              assert all(m['backend']['feature_markers'].values())
              print('VTST_BACKEND_VERIFIED',m['backend'])
              print('EXPORTED_TEXT_INPUT_COUNT',len(names))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h2-neb-production-inputs-status-20261013
          path: |
            h2_neb_status.txt
            h2_neb_production_inputs.tar.gz
          retention-days: 14
