name: Cancel CaFresh October 14 batch only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-ca-corrosion-fresh-20261015.yml']
permissions:
  contents: read
concurrency:
  group: cancel-CaFresh-23-exact-jobIDs-20261015
  cancel-in-progress: false
jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact known CaFresh model roster before cancellation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/cancel_Ca_corrosion_fresh_20261014.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('scripts/cancel_Ca_corrosion_fresh_20261014.py').read_text()
          assert 'len(EXPECTED) == 23' in s
          assert '"H2": "63681996"' in s and '"H2O": "63681997"' in s
          assert '635859' not in s and '636149' not in s and '636381' not in s
          assert 'ledger.get("jobs") != EXPECTED' in s
          assert 'scancel' in s
          print('EXACT_SCOPE_VALIDATED|Only 23 original CaFresh job IDs')
          PY
      - name: Cancel only ledger-verified CaFresh Slurm jobs and verify accounting
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION|$name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_ca_cancel"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_ca_cancel-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_ca_cancel" "$HOME/.ssh/hpc_ca_cancel-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_ca_cancel" "$HOME/.ssh/hpc_ca_cancel-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_ca_cancel" </dev/null
          echo 'STAGE|Cancel only exact previously submitted CaFresh job IDs; preserve output files'
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_ca_cancel" -o CertificateFile="$HOME/.ssh/hpc_ca_cancel-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' < scripts/cancel_Ca_corrosion_fresh_20261014.py | tee CaFresh_cancel_20261015.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CaFresh_exact23_cancellation_20261015
          path: CaFresh_cancel_20261015.log
          retention-days: 30
