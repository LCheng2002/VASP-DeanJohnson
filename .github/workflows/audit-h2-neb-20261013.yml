name: Audit H2 dissociation NEB parents
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-h2-neb-20261013.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read approved endpoints and capability metadata
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_neb"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_neb-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_neb" "$HOME/.ssh/hpc_neb-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_neb" </dev/null
          python3 -m py_compile calculations/H2_dissociation_NEB_20261013/audit_parents.py
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_neb" -o CertificateFile="$HOME/.ssh/hpc_neb-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" "bash -lc 'module purge; module load oneapi vasp/6.3.2-intel-2021.4.0; python3 -'" < calculations/H2_dissociation_NEB_20261013/audit_parents.py > h2_neb_parent_audit.json
          python3 -c 'import json;d=json.load(open("h2_neb_parent_audit.json"));print("CHECKED",d["checked_at"]);print("FOUND",{k:v["exists"] for k,v in d["models"].items()});print("FEATURES",d["environment"].get("feature_strings"))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h2-neb-parent-audit-20261013
          path: h2_neb_parent_audit.json
          retention-days: 7
