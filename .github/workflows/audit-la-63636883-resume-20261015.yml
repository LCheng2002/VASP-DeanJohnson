name: Audit LaH3 63636883 restart point only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-la-63636883-resume-20261015.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate read-only checkpoint audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Mechanism_extensions_20261012/audit_La_63636883_resume_20261015.py
      - name: Read 63636883 and only La checkpoint model metadata
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_la_audit"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_la_audit-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_la_audit" "$HOME/.ssh/hpc_la_audit-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_la_audit" "$HOME/.ssh/hpc_la_audit-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_la_audit" </dev/null
          echo 'READ_ONLY|La 63636883 checkpoint audit; no Slurm writes'
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_la_audit" -o CertificateFile="$HOME/.ssh/hpc_la_audit-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' < calculations/Mechanism_extensions_20261012/audit_La_63636883_resume_20261015.py > La_63636883_resume_audit.json
          python3 - <<'PY'
          import json
          a=json.load(open('La_63636883_resume_audit.json'))
          print('CHECKED_AT',a['checked_at'])
          for name,m in a['models'].items():
              c=m.get('01_relax',{});print('MODEL',name,'exists',m['exists'],'verified',m['finished'],'source_relax',c.get('outcar'),'checkpoint',c.get('geometry',{}).get('sha256'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: La_63636883_checkpoint_audit
          path: La_63636883_resume_audit.json
          retention-days: 14
