name: Submit four Ca OH dipole calibrations only
# Exact-original PAW lookup is required; first attempt stopped before any sbatch.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-ca-oh-calibration-20261015.yml']
permissions:
  contents: read
concurrency:
  group: ca-oh-four-point-dipole-calibration-20261015
  cancel-in-progress: false
jobs:
  submit-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build four calibrated inputs from verified archived geometries
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Ca_OH_dipole_calibration_20261015/calibrate.py calculations/Ca_OH_dipole_calibration_20261015/prepare_exact_paw.py
          python3 calculations/Ca_OH_dipole_calibration_20261015/calibrate.py --preview --preview-root "$RUNNER_TEMP/Ca_OH_P0_preview"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'Ca_OH_P0_preview'
          m=json.loads((root/'manifest.json').read_text())
          assert m['preview'] and m['max_models']==4 and m['no_CaFresh_restart']
          names=['M0_OH','M1_OH','M0_OH_H2O','M1_OH_H2O']
          assert m['models']==names and not list(root.rglob('POTCAR'))
          for name in names:
              d=json.loads((root/name/'model.json').read_text())
              assert d['fixed_atoms']==32 and d['new_geometry_equals_source']
              assert d['dipole']['minimum_atom_to_cut_A']>5
              assert all(0<x<1 for x in d['dipole']['DIPOL_direct'])
              print('VERIFIED_INPUT',name,d['composition'],d['dipole']['DIPOL_direct'])
          base='calculations/Ca_corrosion_20261014/verified_parents_20261014'
          paths=['calculations/Ca_OH_dipole_calibration_20261015/plan.json',
                 'calculations/Ca_OH_dipole_calibration_20261015/calibrate.py',
                 'calculations/Ca_OH_dipole_calibration_20261015/prepare_exact_paw.py',base+'/AUDIT.json']
          for name in names:
              for rel in ['calculation_inputs/INCAR.static','calculation_inputs/KPOINTS','results/01_relax/CONTCAR']:
                  paths.append(base+'/models/'+name+'/'+rel)
          for path in paths:
              assert '..' not in Path(path).parts and Path(path).is_file()
              assert Path(path).name not in ('POTCAR','WAVECAR','CHGCAR')
          Path('calibration_deployment_paths.txt').write_text('\n'.join(paths)+'\n')
          print('SCOPE_OK|4 statics only; no cancelled CaFresh restart, no new adsorption or NEB jobs')
          PY
      - name: Transfer approved text inputs and submit four Slurm single points
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION|$name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_ca_p0"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_ca_p0-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_ca_p0" "$HOME/.ssh/hpc_ca_p0-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_ca_p0" "$HOME/.ssh/hpc_ca_p0-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_ca_p0" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_ca_p0" -o CertificateFile="$HOME/.ssh/hpc_ca_p0-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage='VASP/github_jobs/Ca_OH_dipole_calibration_20261015'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - -T calibration_deployment_paths.txt | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 calculations/Ca_OH_dipole_calibration_20261015/prepare_exact_paw.py" | tee calibration_submission.txt
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/Ca_OH_dipole_calibration_20261015/calibrate.py" --status' | tee calibration_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Ca-OH-four-point-calibration-inputs-and-receipt-20261015
          path: |
            ${{ runner.temp }}/Ca_OH_P0_preview
            calibration_submission.txt
            calibration_status.txt
          retention-days: 14
