name: Audit MgNi cycle modelling parents
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-mgni-cycle-parents.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read only selected parent files
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_cycle"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_cycle-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_cycle" "$HOME/.ssh/hpc_cycle-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_cycle" </dev/null
          python3 -m py_compile scripts/inspect_mgni_cycle_parents.py
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_cycle" -o CertificateFile="$HOME/.ssh/hpc_cycle-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' < scripts/inspect_mgni_cycle_parents.py > mgni_cycle_parents.json
          python3 -c 'import json; d=json.load(open("mgni_cycle_parents.json")); print("AUDITED_PARENT_COUNT",len(d["models"]));print("POTCAR_DATA_NOT_EXPORTED")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mgni-cycle-parents
          path: mgni_cycle_parents.json
          retention-days: 2
