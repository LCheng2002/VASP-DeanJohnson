name: Read La branch 63636883 timeout and convergence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-la-branch-63636883-20261015.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read only 63636883 Slurm status and five La product validation flags
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!key:-}" || { echo "MISSING_CONFIGURATION|$key"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/la_status_key"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/la_status_key-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/la_status_key" "$HOME/.ssh/la_status_key-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/la_status_key" "$HOME/.ssh/la_status_key-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/la_status_key" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/la_status_key" -o CertificateFile="$HOME/.ssh/la_status_key-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' <<'REMOTE' | tee la_63636883_status.txt
          import datetime,json,subprocess
          from pathlib import Path
          print('CHECKED_AT|'+datetime.datetime.now().astimezone().isoformat(),flush=True)
          base=Path.home()/'MgNi_LaH3_extensions_20261012'
          ledger=base/'recovery_La_Mg_only_20261013'/'submission.json'
          if ledger.exists():
            d=json.loads(ledger.read_text())
            print('LEDGER_LA|'+str(d.get('jobs',{}).get('La')))
          else:print('LEDGER_MISSING')
          for cmd in [
             ['squeue','-h','-j','63636883','-o','%i|%j|%T|%M|%l|%R'],
             ['sacct','-X','-n','-P','-j','63636883','-o','JobID,JobName%36,State,ExitCode,Elapsed,Timelimit,Start,End,Reason'],
             ['sacct','-n','-P','-j','63636883','-o','JobID,JobName%36,State,ExitCode,Elapsed,Timelimit,Start,End']
          ]:
            p=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
            print('COMMAND|'+cmd[0]+'|RC='+str(p.returncode))
            print(p.stdout.strip()[:12000]); 
            if p.returncode:print('SLURM_ERROR|'+p.stderr.strip()[:600])
          names=['L_vMg_near','L_vMg_far','L_vLa','L_MgH2_vMg','L_transfer']
          for name in names:
            p=base/name
            info={'model':name,'exists':p.is_dir(),'verified_finished':(p/'VERIFIED_FINISHED').is_file()}
            for stage in ('01_relax','02_static'):
              v=p/stage/'validation.json'
              if v.is_file():
                try:
                  j=json.loads(v.read_text())
                  info[stage]={'verified':j.get('verified'),'normal_end':j.get('normal_end'),
                    'last_scf_ediff':j.get('last_scf_ediff'),
                    'ionic_converged':j.get('ionic_converged'),
                    'max_free_force_eV_A':j.get('max_free_force_eV_A'),
                    'F_eV':j.get('F_eV')}
                except Exception as e:info[stage]={'parse_error':str(e)[:200]}
              else:
                q=p/stage
                info[stage]={'directory_exists':q.is_dir(),'OUTCAR_exists':(q/'OUTCAR').is_file(),
                  'CONTCAR_exists':(q/'CONTCAR').is_file()}
            print('MODEL|'+json.dumps(info,ensure_ascii=False))
          print('READ_ONLY_CHECK|No jobs submitted or cancelled, no output files edited')
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: La_job_63636883_status
          path: la_63636883_status.txt
          retention-days: 7
