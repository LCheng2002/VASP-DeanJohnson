name: Check Siyuan MgNi LaH3 mechanism extensions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-mechanism-extensions-20261012.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Query only the five submitted Slurm job groups
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_status"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_status-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_status" "$HOME/.ssh/hpc_status-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_status" "$HOME/.ssh/hpc_status-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_status" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/hpc_status" -o CertificateFile="$HOME/.ssh/hpc_status-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'bash -s' <<'REMOTE'
          set -euo pipefail
          date '+CHECKED_AT|%Y-%m-%d %H:%M:%S %Z'
          echo '=== EXACT_ACTIVE_JOBS ==='
          squeue -r -j 63585911,63585912,63585913,63585914,63585915 -h -o '%i|%j|%T|%M|%R' || true
          echo '=== EXACT_ACCOUNTING_RECORDS ==='
          sacct -X -n -P -j 63585911,63585912,63585913,63585914,63585915 -o JobIDRaw,JobName%24,State,ExitCode,Elapsed,Start,End
          echo '=== VERIFIED_OUTPUTS ==='
          python3 "$HOME/MgNi_LaH3_extensions_20261012/runner.py" --status | grep -E '^(MODEL|[0-9]+|[[:space:]]*"jobs"|[[:space:]]*"all_submitted"|[[:space:]]*"maximum_models")' | cut -c 1-550 || true
          REMOTE
