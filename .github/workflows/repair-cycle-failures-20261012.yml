name: Repair diagnosed MgNi cycle failures
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-cycle-failures-20261012.yml']
permissions:
  contents: read
concurrency:
  group: mgni-cycle-repairs-20261012-v1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f101922e72b52074c700c45dba15a32d9849c332
          persist-credentials: false
      - name: Compile the three reviewed repair scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_cycle_repair_inputs_20261012.py scripts/run_cycle_repairs_20261012.py scripts/submit_cycle_repairs_20261012.py
          test "$(git rev-parse HEAD)" = f101922e72b52074c700c45dba15a32d9849c332
      - name: Prepare isolated continuations and submit fixed repair roster
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          for v in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "Missing configuration: $v"; exit 1; }
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_fix"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_fix-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_fix" "$HOME/.ssh/hpc_fix-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_fix" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_fix" -o CertificateFile="$HOME/.ssh/hpc_fix-cert.pub")
          ssh "${opts[@]}" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'mkdir -p "$HOME/VASP/github_jobs/Cycle_repair_driver_20261012"'
          sftp "${opts[@]}" -b - "$HPC_USER@sydata.hpc.sjtu.edu.cn" <<'BATCH'
          put scripts/prepare_cycle_repair_inputs_20261012.py VASP/github_jobs/Cycle_repair_driver_20261012/prepare_cycle_repair_inputs_20261012.py
          put scripts/run_cycle_repairs_20261012.py VASP/github_jobs/Cycle_repair_driver_20261012/run_cycle_repairs_20261012.py
          put scripts/submit_cycle_repairs_20261012.py VASP/github_jobs/Cycle_repair_driver_20261012/submit_cycle_repairs_20261012.py
          BATCH
          ssh "${opts[@]}" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 "$HOME/VASP/github_jobs/Cycle_repair_driver_20261012/prepare_cycle_repair_inputs_20261012.py" && python3 "$HOME/VASP/github_jobs/Cycle_repair_driver_20261012/submit_cycle_repairs_20261012.py" && python3 "$HOME/MgNi_abs_des_cycle_20261011/repairs_20261012_v1/run_cycle_repairs_20261012.py" status' | tee cycle_repair_submission_20261012.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cycle-repair-submission-20261012
          path: cycle_repair_submission_20261012.txt
          retention-days: 14
