name: Reconcile two Ca OH P0 arrays and cancel redundant new array only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/reconcile-ca-oh-p0-duplicate-20261015.yml']
permissions:
  contents: read
concurrency:
  group: CaOH-P0-duplicate-reconciliation-20261015
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Identify original and new arrays, remove redundant new only if original viable
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_reconcile"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_reconcile-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_reconcile" "$HOME/.ssh/hpc_reconcile-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_reconcile" "$HOME/.ssh/hpc_reconcile-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_reconcile" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/hpc_reconcile" -o CertificateFile="$HOME/.ssh/hpc_reconcile-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' <<'REMOTE' | tee ca_p0_reconcile_log.txt
          import json, subprocess, datetime, time
          from pathlib import Path
          H=Path.home()
          old=H/'Ca_OH_dipole_calibration_20261015'
          new=H/'Ca_OH_P0_calibration_v1'
          NAME=['M0_OH','M1_OH','M0_OH_H2O','M1_OH_H2O']
          assert old.joinpath('submission.json').exists() and new.joinpath('submission.json').exists(), 'One of the two P0 ledgers is missing'
          ol=json.loads((old/'submission.json').read_text())
          nl=json.loads((new/'submission.json').read_text())
          assert ol['job_id']=='63686231' and ol['models']==NAME, 'Unexpected original job: refuse cancellation'
          assert nl['job_id']=='63693436' and nl['models']==NAME and nl['CaFresh_resubmitted'] is False, 'Unexpected new job: refuse cancellation'
          def query(cmd):
            r=subprocess.run(cmd,text=True,capture_output=True,timeout=30)
            assert r.returncode==0, 'Slurm query failed: '+r.stderr[:250]
            return r.stdout
          print('CHECKED_AT|'+datetime.datetime.now().astimezone().isoformat())
          before=query(['squeue','-r','-h','-j','63686231,63693436','-o','%i|%j|%T|%M|%R'])
          print('BEFORE_QUEUE|'+before.replace('\n','; '))
          old_active=[]
          new_active=[]
          for line in before.splitlines():
            ids=line.split('|')
            if ids[0].startswith('63686231_'):
              assert ids[1]=='CaOH_P0_calibration','Unexpected old job name'
              old_active.append(ids[0])
            if ids[0].startswith('63693436_'):
              assert ids[1]=='CaOH_P0_dipole','Unexpected new job name'
              new_active.append(ids[0])
          old_complete=all((old/n/'CALIBRATION_COMPLETE').is_file() for n in NAME)
          old_viable=bool(old_active or old_complete)
          print('ORIGINAL|active='+str(old_active)+'|all_four_calibrated='+str(old_complete))
          print('NEW|active='+str(new_active))
          if old_viable and new_active:
            # The new array is a redundant implementation of the same four fixed-geometry P0 statics.
            subprocess.run(['scancel','63693436'],check=True,timeout=40)
            print('REDUNDANT_NEW_ARRAY_SCANCEL_ACCEPTED|63693436')
          else:
            print('NO_CANCEL|Original not active or complete; retain new for potential recovery')
          for i in range(5):
            latest=query(['squeue','-r','-h','-j','63686231,63693436','-o','%i|%j|%T|%M|%R'])
            if not old_viable or not any(x.startswith('63693436_') for x in latest.splitlines()):break
            time.sleep(2)
          print('AFTER_QUEUE|'+latest.replace('\n','; '))
          print('ACCOUNTING|'+query(['sacct','-X','-n','-P','-j','63686231,63693436','-o','JobID,JobName%28,State,ExitCode,Elapsed']).replace('\n','; '))
          print('NO_OTHER_PROJECTS_TOUCHED|No files deleted and no CaFresh restarts')
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CaOH_P0_duplicate_reconciliation_20261015
          path: ca_p0_reconcile_log.txt
          retention-days: 14
