name: Submit MgNi LaH3 mechanism extensions on Siyuan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-mechanism-extensions-20261012.yml']
permissions:
  contents: read
concurrency:
  group: MgNi-LaH3-extensions-20261012
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check input manifest and runner
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Mechanism_extensions_20261012/runner.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('calculations/Mechanism_extensions_20261012/plan.json').read_text())
          assert d['maximum_models_including_H2']==15 and d['no_NEB'] is True
          assert len(d['parents'])==5
          assert sum(map(len,[d['La_children'],d['Mg_children'],d['Hx_children']]))==9
          for p in d['sources'].values():
              assert (Path(p['path'])).is_file(),p['path']
          print('MODEL_PLAN_OK|5 parents + H2 reference + 9 dependent children')
          PY
      - name: Upload approved text inputs and submit Slurm jobs
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "MISSING_CONFIGURATION|$name"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_submission"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_submission-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_submission" "$HOME/.ssh/hpc_submission-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_submission" "$HOME/.ssh/hpc_submission-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_submission" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_submission" -o CertificateFile="$HOME/.ssh/hpc_submission-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage='VASP/github_jobs/MgNi_LaH3_extensions_repo_20261012'
          echo 'STAGE|Deploying only approved text-only inputs; no pseudopotentials or keys in upload'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - \
            calculations/Mechanism_extensions_20261012/plan.json \
            calculations/Mechanism_extensions_20261012/runner.py \
            structures/interfaces/MgH2_LaH3/CONTCAR \
            structures/interfaces/MgH2_Mg2Ni/POSCAR \
            structures/interfaces/Mg_Mg2Ni_Mg10-10_Mg2Ni_100/POSCAR \
            | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          echo 'STAGE|Checking cluster-local licensed references and submitting guarded Slurm batch'
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 calculations/Mechanism_extensions_20261012/runner.py --submit" | tee mechanism_extensions_submission.txt
          echo 'STAGE|Read-only Slurm verification'
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/MgNi_LaH3_extensions_20261012/runner.py" --status' | tee mechanism_extensions_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mechanism-extension-submission-record
          path: |
            mechanism_extensions_submission.txt
            mechanism_extensions_status.txt
          retention-days: 7
