name: Diagnose fixed MgNi LaH3 parent timeouts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-mechanism-timeouts-20261013.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read 63585911 output metadata without running or changing VASP
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/inspect_mechanism_timeout_20261013.py
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_diag"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_diag-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_diag" "$HOME/.ssh/hpc_diag-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_diag" "$HOME/.ssh/hpc_diag-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_diag" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_diag" -o CertificateFile="$HOME/.ssh/hpc_diag-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 -' < scripts/inspect_mechanism_timeout_20261013.py > parent_timeout_diagnostic.jsonl
          python3 - <<'PY'
          import json
          p='parent_timeout_diagnostic.jsonl'
          d=open(p).read().splitlines()
          assert any(x.startswith('MODEL_AUDIT|X025_A|') for x in d)
          assert any(x.startswith('MODEL_AUDIT|X025_B|') for x in d)
          print('ACTUAL_CLUSTER_DIAGNOSTIC_COMPLETE')
          for x in d:
              if x.startswith('AT|'):print(x)
              if x.startswith('MODEL_AUDIT|'):
                  _,name,b=x.split('|',2);r=json.loads(b);a=r.get('01_relax',{});q=a.get('outcar',{});v=a.get('validation')
                  print('SUMMARY|'+name+'|marker='+str(r.get('complete_marker'))+'|relax_verified='+str(v and v.get('verified'))+'|ionic_steps='+str(len(a.get('ionic_summary',[])))+'|final_force_all='+str(q.get('last_force_max_all_eV_A'))+'|energy='+str((q.get('energy_tail') or [None])[-1]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parent-timeout-diagnostic-20261013
          path: parent_timeout_diagnostic.jsonl
          retention-days: 7
