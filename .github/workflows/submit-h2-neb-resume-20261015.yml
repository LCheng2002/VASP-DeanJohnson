name: Resume two H2 NEB paths after 63614948 and 63614949 timeout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-h2-neb-resume-20261015.yml']
permissions:
  contents: read
concurrency:
  group: h2-neb-resume-63614948-63614949-20261015
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check continuation driver scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          driver=calculations/H2_dissociation_NEB_20261013/resume_H2_NEB_63614948_63614949_20261015.py
          python3 -m py_compile "$driver"
          python3 - <<'PY'
          from pathlib import Path
          code=Path('calculations/H2_dissociation_NEB_20261013/resume_H2_NEB_63614948_63614949_20261015.py').read_text()
          assert 'JOBS = {"Mg": "63614948", "Mg2Ni_region": "63614949"}' in code
          assert '"TIMEOUT"' in code and 'afterok:' in code
          assert 'CONTCAR' in code and 'BAND_VERIFIED' in code and 'NEB_VERIFIED' in code
          assert 'EXPECTED_BINARY_SHA' in code and 'check_slurm()' in code
          print('CHECKPOINT_CONTINUATION_SCOPE_OK')
          PY
      - name: Deploy text-only driver, precheck, and submit continuation
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!key:-}" || { echo "MISSING_CONFIG|$key"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/h2_continue"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/h2_continue-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/h2_continue" "$HOME/.ssh/h2_continue-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/h2_continue" "$HOME/.ssh/h2_continue-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/h2_continue" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/h2_continue" -o CertificateFile="$HOME/.ssh/h2_continue-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          folder="VASP/github_jobs/H2_NEB_resume_20261015/$GITHUB_SHA"
          driver="calculations/H2_dissociation_NEB_20261013/resume_H2_NEB_63614948_63614949_20261015.py"
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$folder\""
          tar -cf - "$driver" | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$folder\" && tar -xf -"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$folder\" && python3 $driver --precheck" | tee h2_neb_resume_precheck.txt
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$folder\" && python3 $driver --submit" | tee h2_neb_resume_submission.txt
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/H2_dissociation_compare_20261013/resume_63614948_63614949_20261015/resume_H2_NEB_63614948_63614949_20261015.py" --status' | tee h2_neb_resume_status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-neb-63614948-63614949-continuation
          path: |
            h2_neb_resume_precheck.txt
            h2_neb_resume_submission.txt
            h2_neb_resume_status.txt
          retention-days: 21
