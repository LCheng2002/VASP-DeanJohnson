name: Audit H2 NEB continuation state 20261015
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-h2-neb-20261015.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read current Slurm and VASP status
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_neb"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_neb-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_neb" "$HOME/.ssh/hpc_neb-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_neb" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_neb" -o CertificateFile="$HOME/.ssh/hpc_neb-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          output="calculations/H2_dissociation_NEB_20261013/LIVE_AUDIT_20261015.txt"
          ssh "${opts[@]}" "$remote" 'python3 -' > "$output" <<'PY'
          from pathlib import Path
          import subprocess, json, datetime, socket, os
          R=Path.home()/'H2_dissociation_compare_20261013'
          print('AUDIT_AT', datetime.datetime.now().astimezone().isoformat(), 'HOST', socket.gethostname(), 'ROOT', R)
          print('ROOT_EXISTS', R.is_dir())
          def run(*args):
              print('COMMAND', ' '.join(args))
              try:
                  p=subprocess.run(args,capture_output=True,text=True,timeout=40)
                  print('EXIT',p.returncode)
                  print(p.stdout[:20000])
                  if p.stderr.strip():print('STDERR',p.stderr[:2000])
              except Exception as e: print('COMMAND_EXCEPTION',repr(e))
          run('sacct','-X','-P','-n','-j','63614945,63614946,63614947,63614948,63614949','-o','JobID,JobName%30,State,ExitCode,Elapsed,Start,End')
          run('squeue','-r','-h','-j','63614945,63614946,63614947,63614948,63614949','-o','%i|%j|%T|%M|%R')
          for rel in ('submission.json','manifest.json'):
              p=R/rel
              if p.exists():
                  try:
                      d=json.loads(p.read_text())
                      if rel=='manifest.json':d={'backend':d.get('backend'), 'scope':d.get('explicit_scope')}
                      print('JSON', rel, json.dumps(d,ensure_ascii=False)[:5000])
                  except Exception as e:print('JSON_ERROR',rel,repr(e))
          for sys in ('Mg','Mg2Ni_region','H2'):
              b=R/sys
              for rel in ('.neb_started','.endpoints_started','ENDPOINTS_VERIFIED','NEB_VERIFIED','clean/VERIFIED_FINISHED','molecule/VERIFIED_FINISHED','product/VERIFIED_FINISHED','barrier_summary.json','neb_coarse/validation.json','ci_neb/validation.json'):
                  p=b/rel
                  if p.exists():print('FLAG',sys,rel,p.stat().st_size)
              for rel in ('clean/relax','clean/static','molecule/relax','molecule/static','product/relax','product/static','neb_coarse','ci_neb'):
                  d=b/rel
                  if not d.exists():continue
                  print('DIR',sys,rel)
                  if rel in ('neb_coarse','ci_neb'):
                      for i in range(1,6):
                          q=d/f'{i:02d}'
                          if q.exists():print('IMAGE',sys,rel,i,{f:(q/f).stat().st_size if (q/f).exists() else None for f in ('POSCAR','CONTCAR','OSZICAR','OUTCAR','WAVECAR')})
                  else:
                      print('FILES',{f:(d/f).stat().st_size if (d/f).exists() else None for f in ('POSCAR','CONTCAR','OSZICAR','OUTCAR','WAVECAR','validation.json')})
          if (R/'logs').exists():
              logs=sorted((R/'logs').glob('*'),key=lambda p:p.stat().st_mtime,reverse=True)
              for p in logs[:12]:
                  if p.is_file() and p.stat().st_size:
                      print('LOG',p.name,'SIZE',p.stat().st_size,'TAIL',p.read_text(errors='replace')[-1700:])
          import sys
          sys.path.insert(0,str(R))
          try:
              import neb_core as core
              for sysname in ('Mg','Mg2Ni_region'):
                  folder=R/sysname/'neb_coarse'
                  print('BAND_DETAIL',sysname,'EXISTS',folder.is_dir())
                  if not folder.is_dir():continue
                  for fname in ('INCAR','vasp.stdout','vasp.stderr'):
                      p=folder/fname
                      if p.exists():print('BAND_FILE',sysname,fname,'SIZE',p.stat().st_size,'TAIL',p.read_text(errors='replace')[-4000:])
                  for i in range(1,6):
                      q=folder/f'{i:02d}'
                      try:
                          initial=core.parse((q/'POSCAR').read_text())
                          current=core.parse((q/'CONTCAR').read_text())
                          status=core.output(q,initial['mask'])
                          xyz=current['xyz'][-2:];sep=float(__import__('numpy').linalg.norm(core.mic(xyz[1]-xyz[0],current['cell'])))
                          print('NEB_IMAGE_DETAIL',sysname,i,'HH_A',round(sep,5),'STATUS',json.dumps({k:status.get(k) for k in ('F_eV','E0_eV','ionic_steps','last_ediff','normal_end','ionic_converged','vtst_force_max','lclimb','neb_marker','max_free_DFT_force')}),'CONTCAR_MTIME',datetime.datetime.fromtimestamp((q/'CONTCAR').stat().st_mtime).astimezone().isoformat())
                      except Exception as e:print('NEB_IMAGE_ERROR',sysname,i,repr(e))
          except Exception as e:print('BAND_AUDIT_EXCEPTION',repr(e))
          print('AUDIT_DONE')
          PY
          cat "$output"
      - name: Commit audit report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculations/H2_dissociation_NEB_20261013/LIVE_AUDIT_20261015.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record Slurm audit for H2 NEB jobs 63614948 and 63614949"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h2-neb-audit-20261015
          path: calculations/H2_dissociation_NEB_20261013/LIVE_AUDIT_20261015.txt
          retention-days: 7
