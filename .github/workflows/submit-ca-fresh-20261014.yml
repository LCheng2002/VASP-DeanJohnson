name: Submit fresh Ca corrosion models
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-ca-fresh-20261014.yml']
permissions:
  contents: read
concurrency:
  group: Ca-corrosion-fresh-20261014
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the new bounded calculation scope
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile calculations/Ca_corrosion_fresh_20261014/fresh.py calculations/Ca_corrosion_fresh_20261014/prepare_potentials.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('calculations/Ca_corrosion_fresh_20261014/plan.json').read_text())
          assert p['maximum_models']==23
          assert p['reference_models']==['Mg_bulk','H2','H2O']
          assert len(p['per_surface_models'])==10
          print('FRESH_SCOPE|23 bounded candidates; all geometry and energies rebuilt')
          PY
      - name: Deploy new generator and request bounded Slurm jobs
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_ca_fresh"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_ca_fresh-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_ca_fresh" "$HOME/.ssh/hpc_ca_fresh-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_ca_fresh" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_ca_fresh" -o CertificateFile="$HOME/.ssh/hpc_ca_fresh-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          stage='VASP/github_jobs/Ca_corrosion_fresh_generator_20261014'
          ssh "${opts[@]}" "$remote" "mkdir -p \"\$HOME/$stage\""
          tar -cf - calculations/Ca_corrosion_fresh_20261014/plan.json calculations/Ca_corrosion_fresh_20261014/fresh.py calculations/Ca_corrosion_fresh_20261014/prepare_potentials.py \
            | ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && tar -xf -"
          ssh "${opts[@]}" "$remote" "cd \"\$HOME/$stage\" && python3 calculations/Ca_corrosion_fresh_20261014/prepare_potentials.py calculations/Ca_corrosion_fresh_20261014/fresh.py" | tee fresh_ca_submission.txt
          ssh "${opts[@]}" "$remote" 'python3 "$HOME/Ca_corrosion_fresh_20261014/fresh.py" --status' | tee fresh_ca_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Ca-fresh-submission-status
          path: |
            fresh_ca_submission.txt
            fresh_ca_status.txt
          retention-days: 7
