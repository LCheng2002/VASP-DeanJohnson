name: Check repaired MgNi jobs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-cycle-repairs-20261012.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect exact repair jobs and actual input settings
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_status"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_status-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_status" "$HOME/.ssh/hpc_status-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_status" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/hpc_status" -o CertificateFile="$HOME/.ssh/hpc_status-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'bash -s' <<'REMOTE' | tee cycle_repair_status_20261012.txt
          set -euo pipefail
          python3 "$HOME/MgNi_abs_des_cycle_20261011/repairs_20261012_v1/run_cycle_repairs_20261012.py" status
          python3 - <<'PYTHON'
          import json,hashlib
          from pathlib import Path
          r=Path.home()/'MgNi_abs_des_cycle_20261011/repairs_20261012_v1'
          for n in ['D_S1b_split_Ni','A_H2_Mg_parallel','H2_reference']:
              d={}
              for st in ['01_relax','02_static']:
                  p=r/n/st
                  d[st]={'incar':(p/'INCAR').read_text(),'kpoints':(p/'KPOINTS').read_text(),'potcar_sha256':hashlib.sha256((p/'POTCAR').read_bytes()).hexdigest()}
              print('ACTUAL_INPUTS|'+n+'|'+json.dumps(d))
          print('H2_SLURM_INPUT|'+(r/'H2_memory_repair.slurm').read_text().replace('\n',' | '))
          PYTHON
          sacct -X -n -P -j 63575040,63575041,63575042,63575043 -o JobID,State,AllocCPUS,ReqMem,Elapsed
          scontrol show job 63575043 | grep -E 'JobId=|JobState=|Dependency=' || true
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycle-repair-status-20261012
          path: cycle_repair_status_20261012.txt
          retention-days: 7
