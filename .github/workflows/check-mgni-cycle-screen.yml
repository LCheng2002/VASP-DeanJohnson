name: Check MgNi cycle screen and refill dependency
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-mgni-cycle-screen.yml']
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read only the exact cycle jobs and input hashes
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_cycle"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_cycle-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_cycle" "$HOME/.ssh/hpc_cycle-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_cycle" </dev/null
          ssh -F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/hpc_cycle" -o CertificateFile="$HOME/.ssh/hpc_cycle-cert.pub" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'bash -s' <<'REMOTE'
          set -euo pipefail
          date '+CHECKED_AT|%Y-%m-%d %H:%M:%S %Z'
          python3 "$HOME/MgNi_abs_des_cycle_20261011/mgni_cycle_batch.py" --status
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,hashlib
          r=Path.home()/'MgNi_abs_des_cycle_20261011'
          m=json.loads((r/'manifest.json').read_text())
          for i,name in list(m['array_indices'].items())+[(9,'H2_reference')]:
              p=r/name/'01_relax/POSCAR';q=p.read_text().splitlines()
              print('INPUT_CHECK|'+str(i)+'|'+name+'|'+q[5]+'|'+q[6]+'|'+hashlib.sha256(p.read_bytes()).hexdigest())
          print('MANIFEST_PINNED_FILE_COUNT|'+str(len(m['input_hashes'])))
          PYTHON
          echo 'REFILL_DEPENDENCY_RECORD'
          scontrol show job 63565366 | grep -E 'JobId=|JobState=|Dependency=|NumNodes=|Command=' || true
          REMOTE
