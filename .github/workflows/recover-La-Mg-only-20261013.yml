name: Recover LaH3 and pure Mg branches only
# 2026-10-13: use corrected sacct JobID parsing; only La and pure Mg, Hx remains paused.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-La-Mg-only-20261013.yml']
permissions:
  contents: read
concurrency:
  group: recover-La-Mg-only-20261013
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate independent recovery driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/recover_La_Mg_branches_20261013.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/recover_La_Mg_branches_20261013.py').read_text()
          assert "NAMES = {" in p and "'La':" in p and "'Mg':" in p
          assert "'Hx':" not in p.split('NAMES = {',1)[1].split('}',1)[0]
          assert "ORIGINAL_IDS" in p and "VERIFIED_FINISHED" in p
          print("SCOPED_RECOVERY_VALIDATION|La + Mg only; no low-H Hx submission")
          PY
      - name: Submit only verified and missing La Mg children
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          for n in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!n:-}" || { echo "MISSING_CONFIGURATION|$n"; exit 1; }
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_recovery"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_recovery-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hpc_recovery" "$HOME/.ssh/hpc_recovery-cert.pub" "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_recovery" "$HOME/.ssh/hpc_recovery-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_recovery" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_recovery" -o CertificateFile="$HOME/.ssh/hpc_recovery-cert.pub")
          remote="$HPC_USER@sylogin.hpc.sjtu.edu.cn"
          echo 'STAGE|Validate independently completed parents then submit only La and Mg'
          ssh "${opts[@]}" "$remote" 'python3 - --submit' < scripts/recover_La_Mg_branches_20261013.py | tee recovery_La_Mg_submissions.txt
          echo 'STAGE|Read-only verification of new Slurm job IDs and child state'
          ssh "${opts[@]}" "$remote" 'python3 - --status' < scripts/recover_La_Mg_branches_20261013.py | tee recovery_La_Mg_status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-La-Mg-only-20261013
          path: |
            recovery_La_Mg_submissions.txt
            recovery_La_Mg_status.txt
          retention-days: 7
