name: Submit MgNi absorption desorption endpoint screen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/submit-mgni-cycle-screen.yml']
permissions:
  contents: read
concurrency:
  group: mgni-cycle-screen-20261011
  cancel-in-progress: false
jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify audited driver
        shell: bash
        run: |
          set -euo pipefail
          echo 'f5696bda76eb2c990e5daab3a09baabf8619a914bf5bed10b37a2a42aa495abc  scripts/mgni_cycle_batch.py' | sha256sum -c -
          python3 -m py_compile scripts/mgni_cycle_batch.py
      - name: Construct on cluster and submit only this requested screen
        shell: bash
        env:
          HPC_USER: ${{ vars.HPC_USER || 'deanfilan' }}
          HPC_SSH_KEY: ${{ secrets.HPC_SSH_KEY }}
          HPC_SSH_CERT: ${{ secrets.HPC_SSH_CERT }}
          HPC_SSH_PASSPHRASE: ${{ secrets.HPC_SSH_PASSPHRASE }}
          HPC_KNOWN_HOSTS: ${{ secrets.HPC_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for v in HPC_USER HPC_SSH_KEY HPC_SSH_CERT HPC_SSH_PASSPHRASE HPC_KNOWN_HOSTS; do
            test -n "${!v:-}" || { echo "Missing configuration: $v"; exit 1; }
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$HPC_SSH_KEY" > "$HOME/.ssh/hpc_cycle"
          printf '%s\n' "$HPC_SSH_CERT" > "$HOME/.ssh/hpc_cycle-cert.pub"
          printf '%s\n' "$HPC_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          cat > "$RUNNER_TEMP/askpass" <<'ASKPASS'
          #!/bin/sh
          printf '%s' "$HPC_SSH_PASSPHRASE"
          ASKPASS
          chmod 700 "$RUNNER_TEMP/askpass"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -f "$HOME/.ssh/hpc_cycle" "$HOME/.ssh/hpc_cycle-cert.pub" "$RUNNER_TEMP/askpass"' EXIT
          DISPLAY=:0 SSH_ASKPASS="$RUNNER_TEMP/askpass" SSH_ASKPASS_REQUIRE=force ssh-add "$HOME/.ssh/hpc_cycle" </dev/null
          opts=(-F /dev/null -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -i "$HOME/.ssh/hpc_cycle" -o CertificateFile="$HOME/.ssh/hpc_cycle-cert.pub")
          ssh "${opts[@]}" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'mkdir -p "$HOME/VASP/github_jobs/MgNi_cycle_driver_20261011"'
          printf 'put scripts/mgni_cycle_batch.py VASP/github_jobs/MgNi_cycle_driver_20261011/mgni_cycle_batch.py\n' | sftp "${opts[@]}" -b - "$HPC_USER@sydata.hpc.sjtu.edu.cn"
          ssh "${opts[@]}" "$HPC_USER@sylogin.hpc.sjtu.edu.cn" 'python3 "$HOME/VASP/github_jobs/MgNi_cycle_driver_20261011/mgni_cycle_batch.py" --submit' | tee mgni_cycle_submission.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mgni-cycle-submission
          path: mgni_cycle_submission.txt
          retention-days: 7
